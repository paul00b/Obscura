<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>Dashboard — Obscura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="admin-body dashboard">
  <script id="app-config" type="application/json">
    { "events": {{{jsonEvents}}}, "saved": {{saved}} }
  </script>

  <header class="dash-header">
    <h1 class="display">Mes galeries</h1>
    <nav class="dash-nav">
      <a class="link" href="/admin/logout">Déconnexion</a>
    </nav>
  </header>

  <div id="banner" class="banner hidden"></div>

  <div class="dash-grid">

    <!-- Liste des galeries -->
    <section class="card card--wide">
      <h2 class="card-title">Galeries</h2>
      <div id="events-list" class="events-list"></div>
      <p id="events-empty" class="empty-state hidden">Aucune galerie pour l'instant. Crées-en une ci-dessous.</p>
    </section>

    <!-- Création d'une galerie -->
    <section class="card">
      <h2 class="card-title">Nouvelle galerie</h2>
      <form method="POST" action="/admin/events" class="form">
        <label class="field">
          <span class="field-label">Nom (soirée, anniversaire, mariage…)</span>
          <input type="text" name="eventName" class="input" placeholder="Soirée chez Paul" required />
        </label>
        <label class="field">
          <span class="field-label">Date de l'événement</span>
          <input type="date" name="eventDate" class="input" />
        </label>
        <label class="field">
          <span class="field-label">Message d'accueil</span>
          <textarea name="welcomeMessage" class="input" rows="2" placeholder="Prends une photo, elle rejoindra la galerie."></textarea>
        </label>
        <label class="field">
          <span class="field-label">Reveal automatique (vide = ouverte tout de suite si déverrouillée)</span>
          <input type="datetime-local" name="revealAt" class="input" />
        </label>
        <label class="toggle">
          <input type="checkbox" name="galleryLocked" checked />
          <span>Galerie verrouillée jusqu'au reveal</span>
        </label>
        <button type="submit" class="btn">Créer le lien</button>
      </form>
    </section>

    <!-- Mot de passe admin (global) -->
    <section class="card">
      <h2 class="card-title">Mot de passe admin</h2>
      <form id="password-form" class="form">
        <label class="field">
          <span class="field-label">Mot de passe actuel</span>
          <input type="password" name="current" class="input" autocomplete="current-password" required />
        </label>
        <label class="field">
          <span class="field-label">Nouveau mot de passe (6+ caractères)</span>
          <input type="password" name="next" class="input" autocomplete="new-password" minlength="6" required />
        </label>
        <button type="submit" class="btn">Changer le mot de passe</button>
      </form>
    </section>

  </div>

  <script src="/js/admin-dashboard.js"></script>
</body>
</html>
