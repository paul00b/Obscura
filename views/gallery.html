<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>{{eventName}} — Galerie</title>
  <link rel="manifest" href="{{base}}/manifest.webmanifest?v={{v}}" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v={{v}}" />
</head>
<body class="gallery-body">
  <script id="app-config" type="application/json">
    { "base": "{{base}}", "revealAt": "{{revealAt}}", "preview": {{preview}} }
  </script>

  <!-- Écran "verrouillé" avant le reveal -->
  <section id="locked" class="screen screen--center">
    <h1 class="display">{{eventName}}</h1>
    <p class="locked-message" id="locked-message">La galerie s'ouvre bientôt.</p>
    <div id="countdown" class="countdown"></div>
  </section>

  <!-- Galerie révélée -->
  <main id="gallery" class="gallery hidden">
    <header class="gallery-header">
      <h1 class="display">{{eventName}}</h1>
      <div class="gallery-actions">
        <button id="select-toggle" type="button" class="btn btn--small">Sélectionner</button>
        <a id="dl-all" class="btn btn--small gallery-download" href="#" download>Tout télécharger</a>
      </div>
    </header>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty-state hidden">Aucune photo pour le moment.</p>
  </main>

  <!-- Barre de sélection (mode sélection) -->
  <div id="sel-bar" class="sel-bar hidden">
    <span id="sel-count">0 sélectionnée</span>
    <div class="sel-bar__actions">
      <button id="sel-cancel" type="button" class="btn btn--small">Annuler</button>
      <button id="sel-download" type="button" class="btn btn--small">Télécharger</button>
    </div>
  </div>
  <!-- Cible du téléchargement de la sélection (évite de quitter la page) -->
  <iframe id="dl-frame" name="dl-frame" title="téléchargement" style="display:none"></iframe>

  <!-- Lightbox plein écran -->
  <div id="lightbox" class="lightbox hidden">
    <button class="lightbox__close" id="lb-close" aria-label="Fermer">×</button>
    <a id="lb-dl" class="lightbox__dl" href="#" aria-label="Télécharger" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
        <path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M5 21h14" />
      </svg>
    </a>
    <button class="lightbox__nav lightbox__nav--prev" id="lb-prev" aria-label="Précédent">‹</button>
    <img id="lb-img" class="lightbox__img" alt="" />
    <button class="lightbox__nav lightbox__nav--next" id="lb-next" aria-label="Suivant">›</button>
  </div>

  <script src="/js/pwa.js?v={{v}}"></script>
  <script src="/js/pull-refresh.js?v={{v}}"></script>
  <script src="/js/pwa-install.js?v={{v}}"></script>
  <script src="/js/gallery.js?v={{v}}"></script>
</body>
</html>
