<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>{{eventName}} — Galerie</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="gallery-body">
  <script id="app-config" type="application/json">
    { "revealAt": "{{revealAt}}", "preview": {{preview}} }
  </script>

  <!-- Écran "verrouillé" avant le reveal -->
  <section id="locked" class="screen screen--center">
    <h1 class="display">{{eventName}}</h1>
    <p class="locked-message" id="locked-message">La galerie s'ouvre bientôt.</p>
    <div id="countdown" class="countdown"></div>
  </section>

  <!-- Galerie révélée -->
  <main id="gallery" class="gallery hidden">
    <header class="gallery-header">
      <h1 class="display">{{eventName}}</h1>
      <a class="btn gallery-download" href="/export" download>Télécharger toutes les photos</a>
    </header>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty-state hidden">Aucune photo pour le moment.</p>
  </main>

  <!-- Lightbox plein écran -->
  <div id="lightbox" class="lightbox hidden">
    <button class="lightbox__close" id="lb-close" aria-label="Fermer">×</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lb-prev" aria-label="Précédent">‹</button>
    <img id="lb-img" class="lightbox__img" alt="" />
    <button class="lightbox__nav lightbox__nav--next" id="lb-next" aria-label="Suivant">›</button>
  </div>

  <script src="/js/pwa.js"></script>
  <script src="/js/pwa-install.js"></script>
  <script src="/js/gallery.js"></script>
</body>
</html>
