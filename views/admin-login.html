<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>Admin — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v={{v}}" />
</head>
<body class="admin-body">
  <section class="screen screen--center">
    <form class="login-card" method="POST" action="/admin/login">
      <h1 class="display">Administration</h1>
      <p class="welcome-message">Espace réservé aux mariés.</p>
      <input
        type="password"
        name="password"
        class="input"
        placeholder="Mot de passe"
        autocomplete="current-password"
        autofocus
        required
      />
      <p class="form-error">{{error}}</p>
      <button type="submit" class="btn btn--full">Se connecter</button>
    </form>
  </section>
</body>
</html>
